<section #heroRoot id="hero" class="hero" aria-label="Introduction">
  <div class="hero__content">
    <p class="hero__eyebrow">
      <span class="hero__eyebrow-line" aria-hidden="true"></span>
      <span class="hero__eyebrow-text">{{ content.eyebrow }}</span>
    </p>

    <h1 class="hero__heading" [attr.aria-label]="roleSummary">
      <span class="hero__heading-line" aria-hidden="true">
        <span class="hero__heading-text">
          <span class="hero__heading-accent">{{ typedRole() }}</span>
          <span class="hero__heading-caret"></span>
        </span>
      </span>
    </h1>

    <p class="hero__description">{{ content.description }}</p>

    <div class="hero__actions">
      <button
        #primaryCta
        type="button"
        class="hero__cta hero__cta--primary"
        (click)="scrollToWork()"
        (pointermove)="onPrimaryPointerMove($event)"
        (pointerleave)="onPrimaryPointerLeave()"
      >
        <span>{{ content.primaryCtaLabel }}</span>
        <svg
          class="hero__cta-icon"
          viewBox="0 0 20 20"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M5 15 15 5M7 5h8v8"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <a
        class="hero__cta hero__cta--secondary"
        [href]="cvUrl"
        [attr.download]="cvFileName"
        aria-label="Download CV as PDF"
      >
        <span>{{ content.secondaryCtaLabel }}</span>
        <svg
          class="hero__cta-icon"
          viewBox="0 0 20 20"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M10 3v9m0 0 3.5-3.5M10 12 6.5 8.5M4 14.5v1.2A1.3 1.3 0 0 0 5.3 17h9.4a1.3 1.3 0 0 0 1.3-1.3v-1.2"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
    </div>

    <div class="hero__highlights" aria-label="Professional highlights">
      @for (stat of content.stats; track stat.label) {
        <div class="hero__stat">
          <span class="hero__stat-icon" aria-hidden="true">
            @switch (stat.icon) {
              @case ('experience') {
                <svg
                  class="hero__stat-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  focusable="false"
                >
                  <circle class="hero__stat-ring" cx="12" cy="12" r="9" />
                  <g class="hero__stat-clock-hand">
                    <path d="M12 7.3V12l3 1.9" />
                  </g>
                  <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none" />
                </svg>
              }
              @case ('projects') {
                <svg
                  class="hero__stat-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  focusable="false"
                >
                  <rect
                    class="hero__stat-card hero__stat-card--back"
                    x="6"
                    y="3.5"
                    width="12"
                    height="9"
                    rx="1.5"
                  />
                  <rect
                    class="hero__stat-card hero__stat-card--middle"
                    x="4.5"
                    y="7.5"
                    width="12"
                    height="9"
                    rx="1.5"
                  />
                  <rect
                    class="hero__stat-card hero__stat-card--front"
                    x="7.5"
                    y="11.5"
                    width="12"
                    height="9"
                    rx="1.5"
                  />
                </svg>
              }
              @case ('satisfaction') {
                <svg
                  class="hero__stat-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  focusable="false"
                >
                  <path
                    class="hero__stat-star"
                    d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"
                  />
                  <path class="hero__stat-spark" d="M19.5 3v3M18 4.5h3" />
                </svg>
              }
            }
          </span>
          <span class="hero__stat-copy">
            <span class="hero__stat-value">{{ stat.value }}</span>
            <span class="hero__stat-label">{{ stat.label }}</span>
          </span>
        </div>
      }
    </div>
  </div>
</section>
