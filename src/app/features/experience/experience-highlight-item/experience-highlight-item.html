<div class="experience-highlight">
  <span class="experience-highlight__icon" aria-hidden="true">
    <lucide-icon [img]="highlightIcon()" [size]="16" [strokeWidth]="1.75" />
  </span>
  <div class="experience-highlight__copy">
    <h4 class="experience-highlight__title">{{ highlight().title }}</h4>
    <p class="experience-highlight__description">{{ highlight().description }}</p>
  </div>
</div>
