<span class="tech-badge" [class.tech-badge--compact]="compact()">
  @if (logoUrl(); as logoUrl) {
    <img
      class="tech-badge__logo"
      [src]="logoUrl"
      [alt]="compact() ? '' : technology().name"
      [title]="technology().name"
      loading="lazy"
      decoding="async"
    />
  } @else {
    <span class="tech-badge__monogram" aria-hidden="true">{{ monogram() }}</span>
  }

  @if (compact()) {
    <span class="sr-only">{{ technology().name }}</span>
  } @else {
    <span class="tech-badge__label">{{ technology().name }}</span>
  }
</span>
