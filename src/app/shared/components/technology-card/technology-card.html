<article
  class="technology-card group flex h-full min-h-[7.25rem] flex-col items-center justify-center gap-2 rounded-2xl border border-secondary-background/70 bg-primary-background/85 px-2 py-4 text-center shadow-[0_12px_26px_-22px_rgba(102,59,45,0.7)] backdrop-blur-sm transition-[transform,border-color,box-shadow] duration-300 ease-out hover:-translate-y-1 hover:border-copper-accent/70 hover:shadow-[0_18px_32px_-20px_rgba(102,59,45,0.6)]"
>
  <img
    class="h-8 w-8 object-contain opacity-90 transition-transform duration-300 ease-out group-hover:scale-110"
    [src]="logoUrl()"
    alt=""
    loading="lazy"
    decoding="async"
    width="32"
    height="32"
  />
  <h3
    class="technology-card__name text-[0.74rem] font-semibold tracking-[0.01em] text-espresso-brown"
  >
    {{ technology().name }}
  </h3>
</article>
