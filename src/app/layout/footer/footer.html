<footer
  class="site-footer w-full border-t border-copper-accent/30 bg-linear-to-r from-espresso-brown to-dark-text text-primary-background"
  role="contentinfo"
>
  <div class="footer-inner mx-auto w-full max-w-[1600px] px-5 py-5 sm:px-8 lg:px-12">
    <a
      class="footer-brand inline-flex items-center gap-2.5"
      href="#home"
      [attr.aria-label]="brand.name + ', ' + brand.designation + ' — back to Home'"
      (click)="onBrandClick($event)"
    >
      <img class="footer-logo" [src]="logoUrl" alt="" width="1536" height="1024" />
      <span class="footer-brand-copy" aria-hidden="true">
        <span class="footer-name">{{ brand.name }}</span>
        <span class="footer-designation">{{ brand.designation }}</span>
      </span>
    </a>

    <div class="footer-social" role="group" aria-label="Social media links">
      <ul class="footer-social-list" role="list">
        @for (link of socialLinks; track link.label) {
          <li>
            <a
              class="social-link inline-grid h-9 w-9 place-items-center rounded-lg border border-copper-accent/70 text-primary-background transition-all duration-300 ease-out hover:-translate-y-0.5 hover:border-copper-accent hover:bg-copper-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-copper-accent focus-visible:ring-offset-2 focus-visible:ring-offset-dark-text"
              [href]="link.url"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="link.label + ' profile'"
              [attr.title]="link.label"
            >
              @switch (link.icon) {
                @case ('linkedin') {
                  <svg
                    class="social-icon"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      d="M20.45 2H3.55C2.69 2 2 2.68 2 3.53v16.94C2 21.32 2.69 22 3.55 22h16.9c.86 0 1.55-.68 1.55-1.53V3.53C22 2.68 21.31 2 20.45 2ZM7.93 18.75H4.98V9.3h2.95v9.45ZM6.45 8.06a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.3 10.69h-2.94v-4.6c0-1.1-.02-2.5-1.52-2.5-1.53 0-1.76 1.19-1.76 2.42v4.68H9.58V9.3h2.83v1.29h.04c.39-.74 1.35-1.52 2.78-1.52 2.97 0 3.52 1.96 3.52 4.5v5.18Z"
                    />
                  </svg>
                }
                @case ('github') {
                  <svg
                    class="social-icon"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.5-1.11-1.5-.91-.63.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.4 9.4 0 0 1 12 6.92c.85 0 1.7.12 2.5.34 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.8-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.59.69.49A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"
                    />
                  </svg>
                }
              }
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</footer>
