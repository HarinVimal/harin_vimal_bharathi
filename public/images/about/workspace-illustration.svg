<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" role="img" aria-labelledby="title desc">
  <title id="title">Warm developer workspace illustration</title>
  <desc id="desc">A dark monitor with abstract code on a walnut desk, a small plant, and a brass lamp casting amber light.</desc>

  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a211a"/>
      <stop offset="0.48" stop-color="#241713"/>
      <stop offset="1" stop-color="#160e0b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="74%" cy="30%" r="58%">
      <stop offset="0" stop-color="#c36a3d" stop-opacity="0.66"/>
      <stop offset="0.45" stop-color="#c36a3d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c36a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="50%" cy="48%" r="72%">
      <stop offset="0" stop-color="#2b3b3a"/>
      <stop offset="1" stop-color="#101716"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b342b"/>
      <stop offset="0.5" stop-color="#241713"/>
      <stop offset="1" stop-color="#120b09"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8a5334"/>
      <stop offset="0.45" stop-color="#663b2d"/>
      <stop offset="1" stop-color="#3a211a"/>
    </linearGradient>
    <linearGradient id="deskEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5744b"/>
      <stop offset="1" stop-color="#4a2a1e"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8c9a5"/>
      <stop offset="0.35" stop-color="#c36a3d"/>
      <stop offset="0.7" stop-color="#8e4b2b"/>
      <stop offset="1" stop-color="#e9d1bb"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c36a3d"/>
      <stop offset="1" stop-color="#7a3d27"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#3f6b4b"/>
      <stop offset="1" stop-color="#88a86d"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Warm dark room -->
  <rect width="1000" height="1250" fill="url(#room)"/>
  <ellipse cx="760" cy="360" rx="430" ry="380" fill="url(#lampGlow)"/>
  <ellipse cx="210" cy="880" rx="330" ry="250" fill="#663b2d" opacity="0.22" filter="url(#soft)"/>
  <path d="M-60 250C110 130 250 180 350 60" fill="none" stroke="#e9d1bb" stroke-opacity="0.07" stroke-width="90" filter="url(#soft)"/>

  <!-- Desk -->
  <path d="M0 872C220 840 690 838 1000 880V1250H0Z" fill="url(#desk)"/>
  <path d="M0 872C220 840 690 838 1000 880V900C650 858 230 862 0 894Z" fill="url(#deskEdge)" opacity="0.85"/>
  <g stroke="#f8f2ea" stroke-opacity="0.05" stroke-width="2" fill="none">
    <path d="M-20 946C240 916 700 916 1020 950"/>
    <path d="M-20 1032C260 1000 720 1006 1020 1036"/>
    <path d="M-20 1130C250 1096 730 1100 1020 1132"/>
  </g>

  <!-- Monitor shadow -->
  <ellipse cx="500" cy="870" rx="430" ry="52" fill="#120b09" opacity="0.55" filter="url(#tiny)"/>

  <!-- Monitor -->
  <rect x="128" y="238" width="744" height="548" rx="34" fill="url(#frame)"/>
  <rect x="150" y="260" width="700" height="504" rx="22" fill="url(#screenGlow)"/>
  <rect x="150" y="260" width="700" height="504" rx="22" fill="none" stroke="#e9d1bb" stroke-opacity="0.12" stroke-width="2"/>
  <ellipse cx="500" cy="500" rx="320" ry="210" fill="#c36a3d" opacity="0.1" filter="url(#soft)"/>

  <!-- Abstract code lines -->
  <g fill="#e9d1bb" opacity="0.9">
    <rect x="190" y="306" width="58" height="9" rx="4.5" fill="#c36a3d"/>
    <rect x="258" y="306" width="112" height="9" rx="4.5" opacity="0.72"/>
    <rect x="382" y="306" width="74" height="9" rx="4.5" fill="#f8c9a5" opacity="0.8"/>
    <rect x="214" y="340" width="42" height="9" rx="4.5" opacity="0.5"/>
    <rect x="266" y="340" width="152" height="9" rx="4.5" opacity="0.8"/>
    <rect x="214" y="374" width="86" height="9" rx="4.5" fill="#e08c5c" opacity="0.9"/>
    <rect x="310" y="374" width="118" height="9" rx="4.5" opacity="0.6"/>
    <rect x="244" y="408" width="64" height="9" rx="4.5" opacity="0.55"/>
    <rect x="318" y="408" width="190" height="9" rx="4.5" fill="#f8c9a5" opacity="0.7"/>
    <rect x="244" y="442" width="110" height="9" rx="4.5" opacity="0.62"/>
    <rect x="364" y="442" width="60" height="9" rx="4.5" fill="#c36a3d" opacity="0.85"/>
    <rect x="274" y="476" width="52" height="9" rx="4.5" opacity="0.45"/>
    <rect x="336" y="476" width="146" height="9" rx="4.5" opacity="0.75"/>
    <rect x="274" y="510" width="92" height="9" rx="4.5" fill="#e08c5c" opacity="0.9"/>
    <rect x="376" y="510" width="104" height="9" rx="4.5" opacity="0.6"/>
    <rect x="244" y="544" width="68" height="9" rx="4.5" opacity="0.55"/>
    <rect x="322" y="544" width="172" height="9" rx="4.5" fill="#f8c9a5" opacity="0.72"/>
    <rect x="214" y="578" width="126" height="9" rx="4.5" opacity="0.6"/>
    <rect x="350" y="578" width="78" height="9" rx="4.5" fill="#c36a3d" opacity="0.8"/>
    <rect x="190" y="612" width="56" height="9" rx="4.5" opacity="0.45"/>
    <rect x="256" y="612" width="132" height="9" rx="4.5" opacity="0.68"/>
    <rect x="190" y="646" width="96" height="9" rx="4.5" fill="#e08c5c" opacity="0.78"/>
    <rect x="296" y="646" width="88" height="9" rx="4.5" opacity="0.5"/>
  </g>
  <rect x="190" y="688" width="2" height="18" fill="#f8c9a5" opacity="0.9"/>

  <!-- Stand -->
  <path d="M458 786H542L560 880H440Z" fill="url(#frame)"/>
  <rect x="382" y="874" width="236" height="20" rx="10" fill="#2a1a15"/>
  <rect x="404" y="874" width="192" height="6" rx="3" fill="#e9d1bb" opacity="0.1"/>

  <!-- Desk lamp -->
  <path d="M958 862L866 520" stroke="url(#brass)" stroke-width="15" stroke-linecap="round"/>
  <path d="M866 520L700 386" stroke="url(#brass)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="866" cy="520" r="18" fill="#c36a3d"/>
  <circle cx="700" cy="386" r="14" fill="#f8c9a5"/>
  <path d="M700 386L606 470 668 524 758 424Z" fill="url(#brass)"/>
  <path d="M614 474L672 518 658 548 590 496Z" fill="#f8c9a5" opacity="0.72"/>
  <ellipse cx="630" cy="540" rx="180" ry="120" fill="#c36a3d" opacity="0.22" filter="url(#soft)"/>
  <ellipse cx="958" cy="866" rx="70" ry="16" fill="url(#brass)"/>

  <!-- Plant -->
  <ellipse cx="862" cy="850" rx="76" ry="18" fill="#120b09" opacity="0.5" filter="url(#tiny)"/>
  <path d="M822 768H902L890 846C888 858 878 866 862 866S836 858 834 846Z" fill="url(#pot)"/>
  <path d="M818 764H906V782H818Z" fill="#e08c5c" opacity="0.85"/>
  <g fill="url(#leaf)">
    <path d="M862 768C838 724 824 684 842 638C866 676 876 722 862 768Z"/>
    <path d="M862 768C878 716 908 682 948 666C940 716 912 752 862 768Z"/>
    <path d="M860 768C832 752 798 748 774 764C802 790 834 790 860 768Z"/>
    <path d="M864 766C868 712 852 672 830 642C812 686 822 732 864 766Z" opacity="0.8"/>
    <path d="M864 768C894 736 920 722 948 724C930 760 900 774 864 768Z" opacity="0.85"/>
  </g>
  <g stroke="#e9d1bb" stroke-opacity="0.28" stroke-width="2" fill="none">
    <path d="M862 768C850 720 842 684 842 638"/>
    <path d="M862 768C890 720 918 690 948 666"/>
    <path d="M860 768C828 762 802 760 774 764"/>
  </g>

  <!-- Keyboard and coffee -->
  <path d="M300 964C330 946 646 946 680 964L708 1026C640 1046 356 1046 276 1026Z" fill="#2a1a15"/>
  <path d="M318 974C350 960 626 960 660 974L682 1016C620 1030 368 1030 300 1016Z" fill="#3a2620"/>
  <g fill="#e9d1bb" opacity="0.22">
    <rect x="336" y="980" width="34" height="7" rx="3"/>
    <rect x="382" y="980" width="34" height="7" rx="3"/>
    <rect x="428" y="980" width="34" height="7" rx="3"/>
    <rect x="474" y="980" width="34" height="7" rx="3"/>
    <rect x="520" y="980" width="34" height="7" rx="3"/>
    <rect x="566" y="980" width="34" height="7" rx="3"/>
    <rect x="356" y="998" width="270" height="7" rx="3"/>
  </g>
  <ellipse cx="138" cy="984" rx="62" ry="16" fill="#120b09" opacity="0.45" filter="url(#tiny)"/>
  <path d="M96 912H178L170 976C168 990 158 998 137 998S107 990 104 976Z" fill="#f8f2ea" opacity="0.9"/>
  <path d="M178 926C210 920 214 960 178 958" fill="none" stroke="#f8f2ea" stroke-opacity="0.9" stroke-width="9"/>
  <ellipse cx="137" cy="914" rx="41" ry="9" fill="#663b2d"/>
  <path d="M126 900C120 890 132 884 128 872M146 900C140 890 152 884 148 872" fill="none" stroke="#e9d1bb" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- Foreground warmth -->
  <ellipse cx="500" cy="1120" rx="520" ry="180" fill="#c36a3d" opacity="0.08" filter="url(#soft)"/>
</svg>
